name = "reflexhon-cloud"
main = "worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9a009ef5b0a39e042797e3218c05669c"

workers_dev = true

[vars]
NODE_ENV = "production"

# Development environment configuration
[env.development.vars]
ENVIRONMENT = "development"
LOG_LEVEL = "debug"

# Staging environment configuration
[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "info"
API_URL = "https://staging-api.reflexhon.cloud"

[[env.staging.routes]]
pattern = "staging-api.reflexhon.cloud/*"
zone_name = "reflexhon.cloud"

