name = "reflexhon-global"
main = "worker-v3.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9a009ef5b0a39e042797e3218c05669c"

workers_dev = true

# Cloudflare AI binding (free tier: 10,000 requests/day)
[ai]
binding = "AI"

# D1 Database binding for cultural datasets and logs
[[d1_databases]]
binding = "DB"
database_name = "reflexhon_global"
database_id = "a879199e-f6f7-45bf-a8c9-08bf0e302dd6"  # Created: 2026-01-10

[vars]
NODE_ENV = "production"
# HuggingFace model name (HF_TOKEN is a secret, set via dashboard or wrangler secret put)
# Using gpt2 - A proven, reliable text generation model
HF_MODEL = "gpt2"

# IMPORTANT: Set HF_TOKEN as a secret (not in vars for security):
# Option 1 (via wrangler CLI): wrangler secret put HF_TOKEN
# Option 2 (via dashboard): Cloudflare Dashboard > Workers > reflexhon-cloud > Settings > Variables > Add secret
# Get your token from: https://huggingface.co/settings/tokens

# Development environment configuration
[env.development.vars]
ENVIRONMENT = "development"
LOG_LEVEL = "debug"

# Staging environment configuration
[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "info"
API_URL = "https://staging-api.reflexhon.cloud"

[[env.staging.routes]]
pattern = "staging-api.reflexhon.cloud/*"
zone_name = "reflexhon.cloud"

